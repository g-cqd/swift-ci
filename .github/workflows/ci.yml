name: CI

# swift-ci checks itself with its own workflow, from this very commit: a change to the CLI or the workflow is what
# runs. Its tests, quality (swift-format and the g-cqd analyzers) and, for a tag, the release of the CLI.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Checks
    uses: ./.github/workflows/swift-ci.yml
    permissions:
      contents: write
    secrets:
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}

  # Code scanning as the family uses it, from this commit (Semgrep + CodeQL on workflows; CodeQL's Swift extractor
  # lags Xcode 26.4's Swift 6.3.3 on macos-26).
  scan:
    name: Code Scanning
    uses: ./.github/workflows/code-scanning.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  # The action alone, as a step of someone else's workflow would use it (`uses: g-cqd/swift-ci@<commit>`).
  action:
    name: Tooling · Action & Archive Smoke
    runs-on: ubuntu-latest
    container: swift:6.4.1-noble
    timeout-minutes: 15
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 2 }
      - uses: ./
        with: { command: validate }
      - id: plan
        uses: ./
        with: { command: plan }
      - name: The plan's outputs are matrices
        env:
          LINUX: ${{ steps.plan.outputs.linux }}
          HAS_MACOS: ${{ steps.plan.outputs.has-macos }}
          SKIPPED: ${{ steps.plan.outputs.skipped }}
          ADVISORIES: ${{ steps.plan.outputs.advisories }}
        run: |
          echo "linux: $LINUX"
          echo "has-macos: $HAS_MACOS, skipped: '$SKIPPED', advisories: '$ADVISORIES'"
          case "$LINUX" in \[*\]) ;; *) echo "linux is not a JSON list" >&2; exit 1 ;; esac
          # Every trigger looks advisories up: an output the action does not declare would read empty.
          [ "$ADVISORIES" = true ] || { echo "advisories is not an output of the action" >&2; exit 1; }
      - uses: ./
        with: { command: steps, arguments: macos-debug }
      - name: Linux archive runs without the installed Swift runtime
        env:
          SWIFT_CI_DISPOSABLE_CONTAINER: "1"
        run: .ci/probes/archive-linux.sh
