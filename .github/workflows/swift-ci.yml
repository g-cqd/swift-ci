name: Swift CI

# The reusable workflow: one graph for a Swift package or an Xcode project, configured by its `.ci/action.json`.
#
#   on:
#     push: { branches: [main], tags: ["v*"] }
#     pull_request:
#     merge_group:
#     schedule: [{ cron: "17 3 * * *" }]
#     workflow_dispatch:
#   jobs:
#     ci:
#       uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@<commit>
#       permissions: { contents: write }   # write only for publishing a tag
#       secrets: inherit
#
#   plan ─┬▶ linux (matrix) ──┐
#         └▶ macos (matrix) ──┴─▶ publish (tags) ─▶ gate
#
# The plan job runs `swift-ci plan`, which decides from the configuration and the event which checks run where: a
# change runs quality and the Linux checks and one macOS job; the nightly run (only when a commit landed) and a tag
# run the heavy macOS checks; a change to documentation only runs nothing. Every other job runs one
# `swift-ci run <check>`. All logic is in the CLI, tested; this file only wires it.
#
# A newer push cancels the run of the previous one on the same ref (never a tag or the nightly run).

on:
  workflow_call:
    inputs:
      package-path:
        description: >-
          The package's directory, relative to the repository root (a repository holding several packages calls this
          workflow once per package). Its `.ci/action.json` configures it; caches, archives and runs are scoped to it.
        type: string
        default: "."
      config:
        description: The configuration file, relative to the package's directory.
        type: string
        default: .ci/action.json
      plan-runner:
        description: Runner labels (JSON) of the plan, publish and gate jobs, which only read and upload.
        type: string
        default: '["ubuntu-latest"]'
      plan-image:
        description: The image the plan and publish jobs run in (they build the CLI).
        type: string
        default: swift:6.4.1-noble
      timeout-minutes:
        type: number
        default: 60

permissions:
  contents: read

# Timing warnings measure hosted-runner contention as well as compiler work. Keep
# the CI budget even for flag-free consumer checks; local defaults stay unchanged.
env:
  AD_TYPECHECK_BUDGET_MS: "250"
  AEMI_TYPECHECK_BUDGET_MS: "250"

concurrency:
  group: swift-ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.package-path }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule' }}

# Every job checks out this repository at the commit of this workflow the caller pinned (`job.workflow_sha`) and runs
# its root action (action.yml), which builds the CLI of that commit and runs one command.

jobs:
  plan:
    name: Plan
    runs-on: ${{ fromJSON(inputs.plan-runner) }}
    container: ${{ inputs.plan-image }}
    timeout-minutes: 15
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      macos: ${{ steps.plan.outputs.macos }}
      has-linux: ${{ steps.plan.outputs.has-linux }}
      has-macos: ${{ steps.plan.outputs.has-macos }}
      publish: ${{ steps.plan.outputs.publish }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      # Credentials kept (read-only token): the CLI fetches the commit a change is compared with, in a private
      # repository too.
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2 }
      - name: Setup · Check Out Swift CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .build/swift-ci-src
          persist-credentials: false
      # The event, the ref and the commit the change is compared with come from the run.
      - name: Plan · Select Checks
        id: plan
        uses: ./.build/swift-ci-src
        with:
          command: plan
          config: ${{ inputs.config }}
          working-directory: ${{ inputs.package-path }}
      # Artifact names of this package's run: none for the root package, `<path>-` for one in a directory.
      - name: Plan · Name Artifacts
        id: scope
        env:
          PACKAGE_PATH: ${{ inputs.package-path }}
        run: |
          if [ "$PACKAGE_PATH" = . ]; then scope=""; else scope="$(printf '%s' "$PACKAGE_PATH" | tr -c 'A-Za-z0-9._-' '-')-"; fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

  linux:
    needs: plan
    if: ${{ needs.plan.outputs.has-linux == 'true' }}
    name: ${{ matrix.title }}
    # An advisory toolchain's leg reports its failure without failing the job, the release or the gate.
    continue-on-error: ${{ matrix.advisory }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux) }}
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Cache · Compute Identity
        id: key
        env:
          PREFIX: ${{ matrix.cache }}-${{ hashFiles(format('{0}/Package.swift', inputs.package-path), format('{0}/Package.resolved', inputs.package-path), format('{0}/**/Package.resolved', inputs.package-path), format('{0}/.swift-version', inputs.package-path), format('{0}/.ci/tools.lock.json', inputs.package-path), format('{0}/{1}', inputs.package-path, inputs.config)) }}
          REVISION: ${{ github.sha }}
        run: |
          echo "key=$PREFIX-$REVISION" >> "$GITHUB_OUTPUT"
          echo "prefix=$PREFIX-" >> "$GITHUB_OUTPUT"
      - name: Cache · Restore SwiftPM
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.package-path == '.' && '.build' || format('{0}/.build', inputs.package-path) }}
            !.build/swift-ci-src
          key: ${{ steps.key.outputs.key }}
          restore-keys: |
            ${{ steps.key.outputs.prefix }}
            ${{ matrix.cache }}-
      - name: Setup · Check Out Swift CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .build/swift-ci-src
          persist-credentials: false
      - name: ${{ matrix.title }}
        uses: ./.build/swift-ci-src
        with:
          arguments: ${{ matrix.id }}
          config: ${{ inputs.config }}
          working-directory: ${{ inputs.package-path }}
      - name: Cache · Save SwiftPM
        if: ${{ success() && steps.cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Not swift-ci's own checkout and build, which its action caches by the hash of its source.
          path: |
            ${{ inputs.package-path == '.' && '.build' || format('{0}/.build', inputs.package-path) }}
            !.build/swift-ci-src
          key: ${{ steps.key.outputs.key }}
      - name: Artifacts · Upload Archives
        if: ${{ matrix.archives }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-ci-${{ needs.plan.outputs.scope }}${{ matrix.id }}
          path: ${{ inputs.package-path }}/.build/swift-ci/dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: plan
    if: ${{ needs.plan.outputs.has-macos == 'true' }}
    name: ${{ matrix.title }}
    # An advisory toolchain's leg reports its failure without failing the job, the release or the gate.
    continue-on-error: ${{ matrix.advisory }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.macos) }}
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Setup · Select Xcode ${{ matrix.xcode }}
        if: ${{ matrix.xcode != '' }}
        env:
          XCODE: ${{ matrix.xcode }}
        run: |
          case "$XCODE" in */*) app="$XCODE" ;; *) app="/Applications/Xcode_$XCODE.app" ;; esac
          sudo xcode-select -s "$app"
          xcodebuild -version
      - name: Setup · Install Swift ${{ matrix.swift }}
        if: ${{ matrix.installSwift }}
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ matrix.swift }}
      - name: Cache · Compute Identity
        id: key
        env:
          PREFIX: ${{ matrix.cache }}-${{ hashFiles(format('{0}/Package.swift', inputs.package-path), format('{0}/Package.resolved', inputs.package-path), format('{0}/**/Package.resolved', inputs.package-path), format('{0}/.swift-version', inputs.package-path), format('{0}/.ci/tools.lock.json', inputs.package-path), format('{0}/{1}', inputs.package-path, inputs.config)) }}
          REVISION: ${{ github.sha }}
        run: |
          echo "key=$PREFIX-$REVISION" >> "$GITHUB_OUTPUT"
          echo "prefix=$PREFIX-" >> "$GITHUB_OUTPUT"
      - name: Cache · Restore SwiftPM
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.package-path == '.' && '.build' || format('{0}/.build', inputs.package-path) }}
            !.build/swift-ci-src
          key: ${{ steps.key.outputs.key }}
          restore-keys: |
            ${{ steps.key.outputs.prefix }}
            ${{ matrix.cache }}-
      - name: Setup · Check Out Swift CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .build/swift-ci-src
          persist-credentials: false
      - name: ${{ matrix.title }}
        uses: ./.build/swift-ci-src
        with:
          arguments: ${{ matrix.id }}
          config: ${{ inputs.config }}
          working-directory: ${{ inputs.package-path }}
      - name: Cache · Save SwiftPM
        if: ${{ success() && steps.cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Not swift-ci's own checkout and build, which its action caches by the hash of its source.
          path: |
            ${{ inputs.package-path == '.' && '.build' || format('{0}/.build', inputs.package-path) }}
            !.build/swift-ci-src
          key: ${{ steps.key.outputs.key }}
      - name: Artifacts · Upload Archives
        if: ${{ matrix.archives }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-ci-${{ needs.plan.outputs.scope }}${{ matrix.id }}
          path: ${{ inputs.package-path }}/.build/swift-ci/dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 7
      - name: Artifacts · Upload Test Results
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-ci-results-${{ needs.plan.outputs.scope }}${{ matrix.id }}
          path: ${{ inputs.package-path }}/.build/swift-ci/results
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Release
    needs: [plan, linux, macos]
    # Every archive job passed (a project may archive on one OS only, so a skipped one is fine).
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ${{ fromJSON(inputs.plan-runner) }}
    container: ${{ inputs.plan-image }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Setup · Check Out Swift CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .build/swift-ci-src
          persist-credentials: false
      - name: Artifacts · Download Archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: swift-ci-${{ needs.plan.outputs.scope }}archive-*
          merge-multiple: true
          path: .build/swift-ci/assets
      - name: Setup · Install Release Tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gh zip > /dev/null
      - name: Publish ${{ github.ref_name }}
        uses: ./.build/swift-ci-src
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          command: publish
          arguments: --assets ${{ github.workspace }}/.build/swift-ci/assets --repository ${{ github.repository }}
          config: ${{ inputs.config }}
          working-directory: ${{ inputs.package-path }}

  gate:
    name: Gate
    # The one check a branch rule requires. Skipped jobs pass (nothing to check, or not a tag); failed or cancelled
    # ones do not. An advisory leg continues on error, so its failure does not reach here.
    needs: [plan, linux, macos, publish]
    if: ${{ always() }}
    runs-on: ${{ fromJSON(inputs.plan-runner) }}
    timeout-minutes: 2
    steps:
      - name: Gate · Verify Required Jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -Eq '"result": "(failure|cancelled)"'; then exit 1; fi
