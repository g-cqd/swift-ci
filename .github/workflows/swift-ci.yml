name: swift-ci

# The reusable workflow: one graph for a Swift package or an Xcode project, configured by its `.swift-ci.json`.
#
#   on:
#     push: { branches: [main], tags: ["v*"] }
#     pull_request:
#     merge_group:
#     schedule: [{ cron: "17 3 * * *" }]
#     workflow_dispatch:
#   jobs:
#     ci:
#       uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@<commit>
#       permissions: { contents: write }   # write only for publishing a tag
#       secrets: inherit
#
#   plan ──▶ linux (matrix) ──┐
#        ├─▶ macos (matrix) ──┼─▶ publish (tags) ─▶ gate
#        └─▶ advisory ────────┘ (never fails the gate)
#
# The plan job runs `swift-ci plan`, which decides from the configuration and the event which checks run where: a
# change runs quality and the Linux checks and one macOS job; the nightly run (only when a commit landed) and a tag
# run the heavy macOS checks; a change to documentation only runs nothing. Every other job runs one
# `swift-ci run <check>`. All logic is in the CLI, tested; this file only wires it.
#
# A newer push cancels the run of the previous one on the same ref (never a tag or the nightly run).

on:
  workflow_call:
    inputs:
      config:
        description: The configuration file, relative to the repository root.
        type: string
        default: .swift-ci.json
      plan-runner:
        description: Runner labels (JSON) of the plan, publish and gate jobs, which only read and upload.
        type: string
        default: '["ubuntu-latest"]'
      plan-image:
        description: The image the plan and publish jobs run in (they build the CLI).
        type: string
        default: swift:6.4.1-noble
      timeout-minutes:
        type: number
        default: 60

permissions:
  contents: read

concurrency:
  group: swift-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule' }}

# Every job checks out this repository at the commit of this workflow the caller pinned (`job.workflow_sha`), and
# runs the CLI of that commit.
env:
  SWIFT_CI_SOURCE: .build/swift-ci-src

jobs:
  plan:
    runs-on: ${{ fromJSON(inputs.plan-runner) }}
    container: ${{ inputs.plan-image }}
    timeout-minutes: 15
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      macos: ${{ steps.plan.outputs.macos }}
      advisory: ${{ steps.plan.outputs.advisory }}
      has-linux: ${{ steps.plan.outputs.has-linux }}
      has-macos: ${{ steps.plan.outputs.has-macos }}
      has-advisory: ${{ steps.plan.outputs.has-advisory }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      # Credentials kept (read-only token): the CLI fetches the commit a change is compared with, in a private
      # repository too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2 }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.SWIFT_CI_SOURCE }}
          persist-credentials: false
      - uses: ./.build/swift-ci-src/actions/setup
        with: { ref: "${{ job.workflow_sha }}" }
      - name: Plan
        id: plan
        env:
          CONFIG: ${{ inputs.config }}
          # What the change is compared with: the previous head of a push, the base of a pull request or a queue.
          BASE: ${{ github.event.before || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          swift-ci plan --config "$CONFIG" --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --base "$BASE"

  linux:
    needs: plan
    if: ${{ needs.plan.outputs.has-linux == 'true' }}
    name: ${{ matrix.title }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Cache key
        id: key
        run: echo "key=${{ matrix.cache }}-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the SwiftPM tree
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            !.build/swift-ci-src
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ matrix.cache }}-
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.SWIFT_CI_SOURCE }}
          persist-credentials: false
      - uses: ./.build/swift-ci-src/actions/setup
        with: { ref: "${{ job.workflow_sha }}" }
      - name: ${{ matrix.title }}
        env:
          CONFIG: ${{ inputs.config }}
          CHECK: ${{ matrix.id }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tag=(); [ "$GITHUB_REF_TYPE" = tag ] && tag=(--tag "$GITHUB_REF_NAME")
          swift-ci run "$CHECK" --config "$CONFIG" "${tag[@]}"
        shell: bash
      - name: Save the SwiftPM tree
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Not the CLI's own checkout and build, which the setup action caches per commit.
          path: |
            .build
            !.build/swift-ci-src
          key: ${{ steps.key.outputs.key }}
      - name: Upload the archives
        if: ${{ startsWith(matrix.id, 'archive-') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-ci-${{ matrix.id }}
          path: .build/swift-ci/dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: plan
    if: ${{ needs.plan.outputs.has-macos == 'true' }}
    name: ${{ matrix.title }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.macos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Select Xcode ${{ matrix.xcode }}
        if: ${{ matrix.xcode != '' }}
        env:
          XCODE: ${{ matrix.xcode }}
        run: |
          case "$XCODE" in */*) app="$XCODE" ;; *) app="/Applications/Xcode_$XCODE.app" ;; esac
          sudo xcode-select -s "$app"
          xcodebuild -version
      - name: Install Swift ${{ matrix.swift }}
        if: ${{ matrix.installSwift }}
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ matrix.swift }}
      - name: Cache key
        id: key
        run: echo "key=${{ matrix.cache }}-${{ hashFiles('Package.swift', 'Package.resolved', '**/Package.resolved') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the SwiftPM tree
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            !.build/swift-ci-src
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ matrix.cache }}-
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.SWIFT_CI_SOURCE }}
          persist-credentials: false
      - uses: ./.build/swift-ci-src/actions/setup
        with: { ref: "${{ job.workflow_sha }}" }
      - name: ${{ matrix.title }}
        env:
          CONFIG: ${{ inputs.config }}
          CHECK: ${{ matrix.id }}
        # Into a file: an orphaned child then holds a file, not the runner's log pipe, and cannot wedge the job.
        run: |
          tag=(); [ "$GITHUB_REF_TYPE" = tag ] && tag=(--tag "$GITHUB_REF_NAME")
          set +e
          swift-ci run "$CHECK" --config "$CONFIG" "${tag[@]}" > "$RUNNER_TEMP/check.log" 2>&1 < /dev/null
          status=$?
          cat "$RUNNER_TEMP/check.log"
          exit $status
        shell: bash
      - name: Save the SwiftPM tree
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Not the CLI's own checkout and build, which the setup action caches per commit.
          path: |
            .build
            !.build/swift-ci-src
          key: ${{ steps.key.outputs.key }}
      - name: Upload the archives
        if: ${{ startsWith(matrix.id, 'archive-') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-ci-${{ matrix.id }}
          path: .build/swift-ci/dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 7
      - name: Upload the result bundles
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-ci-results-${{ matrix.id }}
          path: .build/swift-ci/results
          if-no-files-found: ignore
          retention-days: 7

  advisory:
    needs: plan
    if: ${{ needs.plan.outputs.has-advisory == 'true' }}
    name: ${{ matrix.title }} (advisory)
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.advisory) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.SWIFT_CI_SOURCE }}
          persist-credentials: false
      - uses: ./.build/swift-ci-src/actions/setup
        with: { ref: "${{ job.workflow_sha }}" }
      - name: ${{ matrix.title }}
        env:
          CONFIG: ${{ inputs.config }}
          CHECK: ${{ matrix.id }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          swift-ci run "$CHECK" --config "$CONFIG"

  publish:
    needs: [plan, linux, macos]
    # Every archive job passed (a project may archive on one OS only, so a skipped one is fine).
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ${{ fromJSON(inputs.plan-runner) }}
    container: ${{ inputs.plan-image }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.SWIFT_CI_SOURCE }}
          persist-credentials: false
      - uses: ./.build/swift-ci-src/actions/setup
        with: { ref: "${{ job.workflow_sha }}" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: swift-ci-archive-*
          merge-multiple: true
          path: .build/swift-ci/assets
      - name: The GitHub CLI and zip
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gh zip > /dev/null
      - name: Publish ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG: ${{ inputs.config }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          swift-ci publish --config "$CONFIG" --assets .build/swift-ci/assets --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY"

  gate:
    # The one check a branch rule requires. Skipped jobs pass (nothing to check, or not a tag); failed or cancelled
    # ones do not. The advisory job is not waited for.
    needs: [plan, linux, macos, publish]
    if: ${{ always() }}
    runs-on: ${{ fromJSON(inputs.plan-runner) }}
    timeout-minutes: 2
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -Eq '"result": "(failure|cancelled)"'; then exit 1; fi
