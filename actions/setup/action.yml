name: swift-ci setup
description: >-
  Builds the swift-ci CLI from a checkout of this repository (cached per commit, OS and architecture) and puts it on
  PATH. Every job of the swift-ci workflow uses it, so all of them run the CLI of the commit the caller pinned.

inputs:
  path:
    description: Where this repository is checked out, relative to the workspace.
    required: false
    default: .build/swift-ci-src
  ref:
    description: The commit checked out at `path`; the cache key.
    required: true

runs:
  using: composite
  steps:
    - name: Restore the swift-ci build
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}/.build
        key: swift-ci-cli-${{ runner.os }}-${{ runner.arch }}-${{ inputs.ref }}
    - name: Build swift-ci
      shell: bash
      env:
        SOURCE: ${{ inputs.path }}
      run: |
        set -euo pipefail
        swift build -c release --package-path "$SOURCE" --product swift-ci > "$RUNNER_TEMP/swift-ci-build.log" 2>&1 \
          || { cat "$RUNNER_TEMP/swift-ci-build.log"; exit 1; }
        bin="$(swift build -c release --package-path "$SOURCE" --show-bin-path)"
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/swift-ci" version
    - name: Save the swift-ci build
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}/.build
        key: swift-ci-cli-${{ runner.os }}-${{ runner.arch }}-${{ inputs.ref }}
