name: Setup Swift (swiftly, composite)
description: >-
  Installs a requested Swift toolchain on macOS or Linux via swiftly using a pure composite shell action (zero Node.js
  runtime dependency — eliminates Node.js 20 deprecation warnings across the g-cqd family).
author: g-cqd

inputs:
  swift-version:
    description: Swift toolchain version to install and activate (e.g. 6.4.2).
    required: true
  for-xcode:
    description: >-
      macOS: make the installed toolchain the one xcodebuild uses (TOOLCHAINS), for a project whose manifest needs a newer
      Swift than the runner's Xcode. A swift.org toolchain has no Apple `ld` (SwiftPM's manifest link then fails with
      "posix_spawn failed"), nor actool, tapi and Xcode's other tools: those it lacks are linked into it. Named alone it
      hides Xcode's Metal compiler, so the Metal toolchain and Xcode's own follow it in TOOLCHAINS.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Swift ${{ inputs.swift-version }} via swiftly
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
      run: |
        set -euo pipefail
        if [[ ! "$SWIFT_VERSION" =~ ^[0-9A-Za-z._-]+$ ]]; then
          echo "::error::invalid swift-version: $SWIFT_VERSION"
          exit 1
        fi
        SWIFTLY_HOME="$RUNNER_TEMP/swiftly/home"
        SWIFTLY_BIN="$RUNNER_TEMP/swiftly/bin"
        mkdir -p "$SWIFTLY_HOME" "$SWIFTLY_BIN"
        export SWIFTLY_HOME_DIR="$SWIFTLY_HOME"
        export SWIFTLY_BIN_DIR="$SWIFTLY_BIN"

        if [ "$RUNNER_OS" = "macOS" ]; then
          if ! command -v swiftly > /dev/null 2>&1 && [ ! -x "$HOME/.swiftly/bin/swiftly" ]; then
            pkg="$RUNNER_TEMP/swiftly.pkg"
            curl -fsSL --retry 3 --retry-delay 2 "https://download.swift.org/swiftly/darwin/swiftly.pkg" -o "$pkg"
            installer -pkg "$pkg" -target CurrentUserHomeDirectory
            rm -f "$pkg"
          fi
          if [ -x "$HOME/.swiftly/bin/swiftly" ]; then
            export PATH="$HOME/.swiftly/bin:$PATH"
          fi
        else
          if ! command -v swiftly > /dev/null 2>&1; then
            arch="$(uname -m)"
            tgz="$RUNNER_TEMP/swiftly.tar.gz"
            curl -fsSL --retry 3 --retry-delay 2 "https://download.swift.org/swiftly/linux/swiftly-${arch}.tar.gz" -o "$tgz"
            tar -xzf "$tgz" -C "$SWIFTLY_BIN"
            rm -f "$tgz"
          fi
        fi

        export PATH="$SWIFTLY_BIN:$PATH"
        swiftly init --skip-install --quiet-shell-followup --assume-yes --no-modify-profile
        # swiftly init moves the binary into $SWIFTLY_BIN/swiftly, so refresh bash's command hash table
        hash -r

        post_install="$RUNNER_TEMP/swiftly-post-install.sh"
        rm -f "$post_install"
        "$SWIFTLY_BIN/swiftly" install --use "$SWIFT_VERSION" --assume-yes --post-install-file "$post_install"
        if [ -f "$post_install" ]; then
          bash "$post_install"
        fi

        location="$("$SWIFTLY_BIN/swiftly" use --print-location)"
        if [ -n "$location" ] && [ ! -d "$location" ]; then
          echo "::error::swiftly returned non-existent toolchain directory"
          exit 1
        fi
        {
          printf 'SWIFTLY_HOME_DIR=%s\n' "$SWIFTLY_HOME"
          printf 'SWIFTLY_BIN_DIR=%s\n' "$SWIFTLY_BIN"
        } >> "$GITHUB_ENV"
        # Put SWIFTLY_BIN on PATH (not location/usr/bin, whose raw clang/swiftc bypasses xcrun SDKROOT injection on macOS).
        {
          printf '%s\n' "$SWIFTLY_BIN"
          if [ -n "$location" ]; then
            printf '%s\n' "$location"
          fi
        } >> "$GITHUB_PATH"
        "$SWIFTLY_BIN/swift" --version
    - name: Select Swift ${{ inputs.swift-version }} for xcodebuild
      if: ${{ inputs.for-xcode == 'true' && runner.os == 'macOS' }}
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
      run: |
        set -euo pipefail
        plist="$(find "$HOME/Library/Developer/Toolchains" -maxdepth 2 -path "*/swift-$SWIFT_VERSION*.xctoolchain/Info.plist" | head -1)"
        if [ -z "$plist" ]; then
          echo "::error::no installed toolchain for Swift $SWIFT_VERSION under ~/Library/Developer/Toolchains"
          exit 1
        fi
        swift_bin="$(dirname "$plist")/usr/bin"
        xcode_bin="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/bin"
        for tool in "$xcode_bin"/*; do
          name="$(basename "$tool")"
          [ "$name" = metal ] || [ -e "$swift_bin/$name" ] || ln -s "$tool" "$swift_bin/$name"
        done
        xcrun -f metal > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
        metal_info="$(dirname "$(dirname "$(dirname "$(xcrun -f metal)")")")/ToolchainInfo.plist"
        metal_id="$(plutil -extract Identifier raw "$metal_info" 2> /dev/null || true)"
        toolchains="$(plutil -extract CFBundleIdentifier raw "$plist") ${metal_id:+$metal_id }com.apple.dt.toolchain.XcodeDefault"
        echo "TOOLCHAINS=$toolchains" >> "$GITHUB_ENV"
        echo "xcodebuild uses: $toolchains"
